<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout/main}">
<div layout:fragment="content" class="container mt-5">
    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card bg-dark text-white p-3" style="--bs-bg-opacity: .8;">
                <div class="card-body text-center">
                    <h3 class="card-title" th:text="${profile.firstName + ' ' + profile.lastName}">Nombre Apellido</h3>
                    <p class="mb-1">Socio #<span th:text="${profile.memberId}">1001</span></p>
                    <p class="mb-3" th:text="${profile.email}">correo@ejemplo.com</p>

                    <hr class="border-light">

                    <h5>Roles Activos</h5>
                    <div class="d-flex flex-wrap justify-content-center gap-2 mt-3">
                        <span class="badge bg-primary" th:each="role : ${profile.activeRoles}" th:text="${role.role.name}">PILOTO</span>
                    </div>

                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card bg-dark text-white p-3 mb-4" style="--bs-bg-opacity: .8;">
                <div class="card-body">
                    <h4 class="card-title border-bottom border-secondary pb-2">Resumen de Vuelos</h4>
                    <div class="row text-center mt-3">
                        <!--
                        <div class="col-6">
                            <h2 class="text-info" th:text="${profile.totalFlightHours + ' hs'}">0 hs</h2>
                            <p class="text-muted">Horas Totales (PIC)</p>
                        </div>
                        <div class="col-6">
                            <h2 class="text-info" th:text="${profile.lastFlightDate != null ? #temporals.format(profile.lastFlightDate, 'dd/MM/yyyy') : 'N/A'}">--/--/----</h2>
                            <p class="text-muted">Último Vuelo</p>
                        </div>
                        -->
                    </div>
                </div>
            </div>

            <div class="card bg-dark text-white p-3" style="--bs-bg-opacity: .8;">
                <div class="card-body">
                    <h4 class="card-title border-bottom border-secondary pb-2">Habilitaciones y CMA</h4>
                    <ul class="list-group list-group-flush mt-3">
                        <!--
                        <li class="list-group-item bg-transparent text-white d-flex justify-content-between align-items-center border-secondary px-0" th:each="qual : ${profile.qualifications}">
                            <div>
                                <strong th:text="${qual.name}">CMA Clase 2</strong>
                                <br>
                                <small class="text-muted" th:text="${qual.details}">Detalles</small>
                            </div>
                            <span class="badge"
                                  th:classappend="${qual.isExpiringSoon} ? 'bg-danger' : 'bg-success'"
                                  th:text="'Vence: ' + ${#temporals.format(qual.expirationDate, 'dd/MM/yyyy')}">
                                Vence: 01/01/2028
                            </span>
                        </li>
                           -->
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
