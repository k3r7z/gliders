<!DOCTYPE html>
<html
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/main.html}">
<body>
    <div layout:fragment="content" class="container">
        <form th:action="@{/vuelos/nuevo}" th:object="${flight}" method="post" class="card p-4 bg-dark text-white">
            <div class="row mb-3">
                <div class="col">
                    <div class="input-group">
                        <label class="input-group-text" for="aircraftId">Aeronave</label>
                        <select id="aircraftId" th:field="*{aircraftId}" class="form-select">
                            <option value="" selected>Seleccionar...</option>
                            <option th:each="aircraft : ${aircrafts}"
                                    th:value="${aircraft.id}"
                                    th:text="${aircraft.registration}"
                                    th:attr="aircraft-type=${aircraft.type}">
                            </option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <div class="input-group">
                        <label class="input-group-text" for="pilotInCommand">Piloto</label>
                        <select th:field="*{pilotInCommandId}" id="pilotInCommand" class="form-select">
                            <option value="">Seleccionar...</option>
                            <option th:each="pilot : ${pilots}"
                                    th:value="${pilot.id}"
                                    th:text="${pilot.fullName}"></option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <div class="input-group">
                        <label class="input-group-text" for="instructorId">Instrutor</label>
                        <select th:field="*{instructorId}" id="instructorId" class="form-select">
                            <option value="">Seleccionar...</option>
                            <option th:each="instructor : ${instructors}" th:value="${instructor.id}" th:text="${instructor.fullName}"></option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <div class="input-group">
                        <label class="input-group-text" for="flightTypeId">Finalidad del vuelo</label>
                        <select th:field="*{flightTypeId}" id="flightTypeId" class="form-select">
                            <option value="">Seleccionar...</option>
                            <option th:each="type : ${flightTypes}"
                                    th:value="${type.id}"
                                    th:text="${type.name}"></option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <div class="input-group">
                        <label class="input-group-text" for="towAirplaneId">Remolcador</label>
                        <select th:field="*{towAirplaneId}" id="towAirplaneId" class="form-select">
                            <option value="">Seleccionar...</option>
                            <option th:each="aircraft : ${aircrafts}" th:value="${aircraft.id}" th:text="${aircraft.registration}"></option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <div class="input-group">
                        <label class="input-group-text" for="departureId">Salida</label>
                        <select th:field="*{departureId}" id="departureId" class="form-select">
                            <option value="">Seleccionar...</option>
                            <option th:each="aerodrome : ${aerodromes}" th:value="${aerodrome.id}" th:text="${aerodrome.name}"></option>
                        </select>
                        <label class="input-group-text" for="startTime">Inicio (UTC-3)</label>
                        <input id="startTime" type="datetime-local" th:field="*{startTime}" class="form-control">
                    </div>
                </div>
            </div>


            <div class="row mb-3">
                <div class="col">
                    <div class="input-group">
                        <label class="input-group-text" for="destinationId">Destino</label>
                        <select th:field="*{destinationId}" id="destinationId" class="form-select">
                            <option value="">Seleccionar...</option>
                            <option th:each="aerodrome : ${aerodromes}" th:value="${aerodrome.id}" th:text="${aerodrome.name}"></option>
                        </select>
                        <label class="input-group-text" for="stopTime">Final (UTC-3)</label>
                        <input type="datetime-local" id="stopTime" th:field="*{stopTime}" class="form-control">
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <button type="submit" class="btn btn-primary w-100">Registrar Vuelo</button>
                </div>
            </div>
        </form>
        <script th:src="@{/script/script.js}" type="text/javascript"></script>
    </div>
</body>
</html>
