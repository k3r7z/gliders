<!DOCTYPE html>
<html
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/main.html}" lang="es">
<body>
    <div layout:fragment="content" class="container">
        <div class="card">
            <div class="card-body">
                <div class="d-flex justify-content-between mb-3">
                    <div>
                        <h3 class="text-">Listado de Socios</h3>
                    </div>
                    <div class="d-flex flex-column justify-content-center">
                        <a th:href="@{/socios/nuevo}" class="btn btn-sm btn-outline-info">
                            <i class="fas fa-plus"></i>
                            Nuevo Socio
                        </a>
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <div th:replace="~{members/table.html :: table(${members})}"></div>
                    </div>
                </div>

            </div>

        </div>

    </div>
</body>
</html>
