<!DOCTYPE html>
<html lang="en">
<table th:fragment="table(members)" class="table text-center">
  <thead>
  <tr>
    <th scope="col">#</th>
    <th scope="col">Nombre</th>
    <th scope="col">Socio desde</th>
    <th scope="col">Teléfono</th>
    <th scope="col">Estado</th>
    <th scope="col">Acciones</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="member : ${members}">
    <th scope="row" th:text="${member.memberId}"></th>
    <td th:text="${member.getFirstName()} + ' ' + ${member.getLastName()}"></td>
    <td th:text="${member.getSignUpDate()}"></td>
    <td th:text="${member.getPhone()}"></td>
    <td th:text="${member.isActive} ? 'Activo' : 'Inactivo'"></td>
    <td class="text-center">
      <div class="d-flex justify-content-center" role="group">

        <a th:href="@{/socios/ver/{id}(id=${member.id})}" class="btn btn-sm btn-outline-secondary me-1">
          <i class="fas fa-eye"></i>
        </a>

        <a th:if="${member.isActive}" th:href="@{/socios/editar/{id}(id=${member.id})}" class="btn btn-sm btn-outline-primary me-1">
          <i class="fas fa-edit"></i>
        </a>

        <form th:if="${not member.isActive}" th:action="@{/socios/dar-de-alta/{id}(id = ${member.id})}" method="post">
          <button type="submit" class="btn btn-sm btn-outline-info"
                  data-bs-toggle="tooltip"
                  data-bs-placement="top"
                  data-bs-title="Dar de alta">
            <i class="fas fa-check"></i>
          </button>
        </form>

        <form th:if="${member.isActive}" th:action="@{/socios/dar-de-baja/{id}(id = ${member.id})}" method="post"
              onsubmit="return confirm('¿Está seguro de que desea dar de baja este socio?');">
          <button type="submit" class="btn btn-sm btn-outline-danger"
                  data-bs-toggle="tooltip"
                  data-bs-placement="top"
                  data-bs-title="Dar de baja">
            <i class="fas fa-trash"></i>
          </button>
        </form>
      </div>
    </td>
  </tr>
  </tbody>
</table>
</html>
